name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Same host ports as docker-compose.yml, so tests use their default URLs.
# SeaweedFS runs as a step: service containers cannot take a command. Test setups create the bucket.
env:
  PGURL: postgres://postgres:postgres@localhost:5433/postgres

jobs:
  check:
    name: Lint, typecheck, unit + integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.31
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create database roles and databases
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f docker/postgres/init/01-roles-and-databases.sql
      - name: Start S3 storage (SeaweedFS, same config as docker-compose.yml)
        run: >-
          docker run -d --name s3 -p 8333:8333
          -v "$PWD/docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro"
          chrislusf/seaweedfs:4.48
          server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
      - name: Install Chromium (PDF rendering)
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check

  e2e:
    name: End-to-end (Playwright)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.31
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create database roles and databases
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f docker/postgres/init/01-roles-and-databases.sql
      - name: Start S3 storage (SeaweedFS, same config as docker-compose.yml)
        run: >-
          docker run -d --name s3 -p 8333:8333
          -v "$PWD/docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro"
          chrislusf/seaweedfs:4.48
          server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
